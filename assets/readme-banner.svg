<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">JSONCraft</title><desc id="d">A JSON object tree and its formatted source stay in sync.</desc><defs><linearGradient id="bg"><stop stop-color="#17283e"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="85" y="70" width="420" height="175" rx="12" fill="#0d1b2c" stroke="#8fa8ff" stroke-width="2"/><g fill="#62e3c1" font-family="monospace" font-size="17"><text x="120" y="112">{</text><text x="150" y="145">"name": "JSONCraft",</text><text x="150" y="178">"items": [ ... ]</text><text x="120" y="215">}</text></g><path d="M505 155H680" stroke="#62e3c1" stroke-width="4" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path><g fill="#132c42" stroke="#62e3c1" stroke-width="2"><rect x="700" y="85" width="150" height="55" rx="9"/><rect x="885" y="85" width="150" height="55" rx="9"/><rect x="700" y="165" width="150" height="55" rx="9"/></g><g fill="#edf3ff" font-family="monospace" font-size="14"><text x="730" y="119">OBJECT</text><text x="915" y="119">ARRAY</text><text x="730" y="199">VALIDATE</text></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">JSONCRAFT</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">EDIT / VALIDATE / EXPLORE</text></svg>